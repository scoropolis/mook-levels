<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#65d6c5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Mook Worlds</title>
  <style>
    :root {
      --ink:#172838; --paper:#fff8e9; --green:#40da78; --red:#ff646c;
      --blue:#55bdf6; --yellow:#ffd24f; --rock:#71818b; --purple:#a65cf1; --navy:#172838;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:#65d6c5;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,sans-serif}
    body{overscroll-behavior:none}
    html,body,.app,.game-screen,.game-screen *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-user-drag:none}
    button{font:inherit}
    .app{width:min(100vw,520px);min-height:100dvh;margin:auto;position:relative;background:var(--paper);overflow:hidden;box-shadow:0 0 80px rgba(23,40,56,.22)}
    .screen{display:none;min-height:100dvh}.screen.active{display:block}

    /* World map */
    .map-screen{height:100dvh;overflow-y:auto;background:linear-gradient(#73dcf1 0 16%,#c6f4d5 16% 100%);scrollbar-width:none}
    .map-screen::-webkit-scrollbar{display:none}
    .map-hero{position:relative;min-height:190px;padding:max(22px,env(safe-area-inset-top)) 22px 28px;overflow:hidden;background:linear-gradient(155deg,#68d9ed,#96ebdd)}
    .map-hero:before,.map-hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.3)}
    .map-hero:before{width:180px;height:65px;right:-30px;top:28px}.map-hero:after{width:125px;height:44px;left:-35px;top:100px}
    .hero-row{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between}
    .eyebrow{font-size:11px;font-weight:1000;letter-spacing:.16em;text-transform:uppercase;opacity:.66}
    .world-progress{padding:8px 12px;border:2px solid rgba(23,40,56,.14);border-radius:99px;background:rgba(255,255,255,.55);font-weight:950;font-size:12px}
    .map-logo{position:relative;z-index:1;margin:20px 0 5px;font-size:58px;line-height:.8;letter-spacing:-.075em;font-weight:1000}
    .map-logo span{display:block;font-size:19px;line-height:1.2;letter-spacing:.13em;text-transform:uppercase;color:#157a70}
    .map-title{position:relative;z-index:1;margin-top:14px;font-size:14px;font-weight:900;color:#31596a}
    .map-wrap{padding:0 12px 38px;background:linear-gradient(#c6f4d5,#fff1bd 48%,#d9e8f1)}
    .stage-card{position:relative;margin:0 0 18px;padding:22px 14px 26px;border:3px solid rgba(23,40,56,.16);border-radius:30px;overflow:hidden;box-shadow:0 12px 0 rgba(23,40,56,.1),0 22px 40px rgba(23,40,56,.1)}
    .stage-card:first-child{margin-top:-8px}
    .stage-green{background:linear-gradient(155deg,#d4f6b9,#72df9a)}
    .stage-blue{background:linear-gradient(155deg,#d8f4ff,#78c9fa)}
    .stage-yellow{background:linear-gradient(155deg,#fff4b3,#ffc95d)}
    .stage-rock{background:linear-gradient(155deg,#dce7ec,#82949e)}
    .stage-purple{background:linear-gradient(155deg,#f1dcff,#ad70ef)}
    .stage-opposite{background:linear-gradient(155deg,#ffb7bb 0 48%,#aef2c6 52% 100%)}
    .stage-quantum{background:linear-gradient(145deg,#18213f,#693ab7 52%,#32c8d4);color:white}
    .stage-card:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-80px;bottom:-100px;background:rgba(255,255,255,.2)}
    .stage-head{position:relative;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;margin:0 6px 20px}
    .stage-number{font-size:10px;font-weight:1000;letter-spacing:.16em;text-transform:uppercase;opacity:.55}
    .stage-name{margin:3px 0 0;font-size:27px;line-height:1;font-weight:1000;letter-spacing:-.045em}
    .stage-icon{width:45px;height:45px;display:grid;place-items:center;border:2px solid rgba(23,40,56,.13);border-radius:15px;background:rgba(255,255,255,.5);font-size:23px;font-weight:1000}
    .level-path{position:relative;z-index:2;display:grid;grid-template-columns:repeat(5,1fr);gap:22px 8px;padding:6px 4px}
    .level-path:before{content:"";position:absolute;left:9%;right:9%;top:25%;height:50%;border-top:5px dotted rgba(23,40,56,.2);border-bottom:5px dotted rgba(23,40,56,.2);transform:skewY(-2deg);pointer-events:none}
    .level-node{position:relative;z-index:1;aspect-ratio:1;border:3px solid rgba(23,40,56,.16);border-radius:50%;color:#6b7b82;background:rgba(255,255,255,.46);font-weight:1000;font-size:17px;box-shadow:0 5px 0 rgba(23,40,56,.14);cursor:not-allowed}
    .level-node:nth-child(n+6){grid-row:2}.level-node:nth-child(6){grid-column:5}.level-node:nth-child(7){grid-column:4}.level-node:nth-child(8){grid-column:3}.level-node:nth-child(9){grid-column:2}.level-node:nth-child(10){grid-column:1}
    .level-node.unlocked{cursor:pointer;color:var(--ink);background:#fff;border-color:#fff;box-shadow:0 5px 0 rgba(23,40,56,.18),0 8px 18px rgba(23,40,56,.12)}
    .level-node.complete{color:white;background:var(--navy);border-color:var(--navy)}
    .level-number{display:block;line-height:1}.level-stars{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);white-space:nowrap;color:#ffd24f;font-size:7px;line-height:1;letter-spacing:-1px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
    .level-node.current{animation:pulse 1.8s ease-in-out infinite;outline:5px solid rgba(255,255,255,.42)}
    .level-node.locked:after{content:"•";position:absolute;right:-1px;bottom:-3px;width:17px;height:17px;display:grid;place-items:center;border-radius:50%;color:white;background:#71818b;font-size:11px}
    .stage-gate{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);padding:5px 14px;border-radius:12px 12px 0 0;background:rgba(23,40,56,.76);color:white;font-size:9px;font-weight:950;letter-spacing:.12em;text-transform:uppercase}

    /* Game */
    .game-screen{height:100dvh;background:linear-gradient(165deg,#e8fff4,#fff8e9 45%,#edf7ff)}
    .game-shell{height:100dvh;display:grid;grid-template-rows:auto auto auto 1fr;position:relative}
    .game-top{padding:max(14px,env(safe-area-inset-top)) 14px 10px;display:grid;grid-template-columns:auto 1fr auto auto;gap:9px;align-items:center}
    .map-back{width:42px;height:42px;border:2px solid #d7e0dc;border-radius:14px;background:white;color:var(--ink);font-weight:1000;box-shadow:0 4px 0 #d7e0dc}
    .level-heading{text-align:center}.level-heading small{display:block;font-size:9px;font-weight:1000;letter-spacing:.16em;text-transform:uppercase;color:#72828b}.level-heading strong{font-size:18px;letter-spacing:-.03em}
    .score-box{text-align:right;font-variant-numeric:tabular-nums}.score-box small{display:block;font-size:9px;font-weight:900;text-transform:uppercase;color:#72828b}.score-box b{font-size:21px}
    .sound-toggle{width:38px;height:38px;border:2px solid #d7e0dc;border-radius:13px;background:white;color:var(--ink);font-size:17px;font-weight:1000;box-shadow:0 4px 0 #d7e0dc}.sound-toggle[aria-pressed="true"]{color:#74848c;background:#edf2f0;box-shadow:0 2px 0 #d7e0dc;transform:translateY(2px)}
    .status-row{padding:0 16px 10px;display:flex;align-items:center;gap:12px}.level-timer{flex:1;height:10px;border:2px solid #d7e0dc;border-radius:99px;background:white;overflow:hidden}.level-timer-fill{height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,#42dd7c,#58c7ef);transition:background .2s}.time-left{width:38px;font-size:13px;font-weight:1000;font-variant-numeric:tabular-nums}.lives{display:flex;gap:5px}.life{width:10px;height:10px;border-radius:50%;background:#ff646c;box-shadow:0 2px 0 #c3434b}.life.lost{background:#d7e0dc;box-shadow:none}
    .mission{min-height:32px;margin:0 12px 9px;padding:7px 11px;border:2px solid rgba(23,40,56,.08);border-radius:12px;background:rgba(255,255,255,.72);text-align:center;font-size:11px;font-weight:900;color:#56707b}
    .board{min-height:0;padding:0 8px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr);gap:8px}
    .cell{position:relative;min-height:0;border:3px solid #dce7e3;border-radius:22px;background:rgba(255,255,255,.78);box-shadow:0 5px 0 #dce7e3;overflow:hidden;touch-action:none;color:white;font-weight:1000;transition:transform .08s ease,background .14s ease}
    .cell:active{transform:translateY(2px)}
    .cell.green{background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.38),transparent 30%),var(--green);border-color:#8af0ad;box-shadow:0 5px 0 #21a957}
    .cell.red{background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.35),transparent 30%),var(--red);border-color:#ffafb3;box-shadow:0 5px 0 #cf3f48}
    .cell.blue{background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.38),transparent 30%),var(--blue);border-color:#b5e8ff;box-shadow:0 5px 0 #218dc7}
    .cell.blue:before{content:attr(data-arrow);position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(48px,18vw,84px);text-shadow:0 3px 0 rgba(20,100,150,.24)}
    .cell.yellow{background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.42),transparent 30%),var(--yellow);border-color:#fff0a8;box-shadow:0 5px 0 #d49a19;color:#5b4300}
    .cell.yellow.tutorial:before{content:"HOLD";position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(20px,7vw,34px);letter-spacing:.06em}.cell.yellow.holding{animation:hold 1s linear forwards}
    .cell.rock{background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.28),transparent 22%),linear-gradient(145deg,#9aa9b0,#55636b);border-color:#c7d1d5;box-shadow:0 5px 0 #46535a}.cell.rock:before{content:attr(data-hits);position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(48px,18vw,82px);text-shadow:0 3px 0 rgba(0,0,0,.25)}
    .cell.purple{background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.42),transparent 30%),var(--purple);border-color:#dbb6ff;box-shadow:0 5px 0 #7133b2}
    .cell.purple.fading{animation:purpleFade var(--purple-duration,1s) linear forwards}
    .cell.tutorial:after{content:attr(data-prompt);position:absolute;left:8px;right:8px;bottom:12px;text-align:center;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
    .cell.hit{animation:hit .28s ease-out}.cell.wrong{animation:wrong .3s linear}
    .level-intro{position:absolute;inset:0;z-index:7;display:grid;place-items:center;padding:18px;background:rgba(23,40,56,.84);backdrop-filter:blur(12px);overflow-y:auto}.level-intro.hidden{display:none}
    .intro-card{width:min(100%,380px);margin:auto;padding:24px 20px 20px;border-radius:28px;background:#fff;text-align:center;box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.08) 0 8px 24px,rgba(0,0,0,.18) 0 18px 42px}
    .intro-kicker,.result-kicker{font-size:10px;font-weight:1000;letter-spacing:.16em;text-transform:uppercase;color:#71818b}.intro-card h2{margin:6px 0 8px;font-size:30px;letter-spacing:-.05em}.intro-summary{margin:0 auto 18px;max-width:300px;color:#62747e;font-size:13px;line-height:1.45}
    .power-heading{display:flex;align-items:center;justify-content:space-between;margin:0 2px 9px;text-align:left}.power-heading b{font-size:13px}.power-heading span{font-size:9px;font-weight:950;letter-spacing:.1em;text-transform:uppercase;color:#768892}
    .god-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.power-card{min-width:0;min-height:112px;padding:10px 6px;border:2px solid #e4ebe8;border-radius:17px;background:#f8fbfa;color:var(--ink);box-shadow:0 3px 0 #dfe7e3;cursor:pointer}.power-card:before{content:attr(data-icon);display:grid;place-items:center;width:31px;height:31px;margin:0 auto 6px;border-radius:11px;background:#e8f6ff;font-size:18px}.power-card b,.power-card span,.power-card small{display:block}.power-card b{font-size:12px}.power-card span{min-height:29px;margin:3px 0;color:#6b7d86;font-size:8px;line-height:1.25}.power-card small{color:#1d9a69;font-size:8px;font-weight:1000;text-transform:uppercase}.power-card[aria-pressed="true"]{border-color:#55bdf6;background:#eaf8ff;box-shadow:0 3px 0 #2797d2,0 0 0 3px rgba(85,189,246,.16);transform:translateY(-1px)}
    .power-card.time-power{width:100%;min-height:70px;margin-top:9px;padding:9px 13px;display:grid;grid-template-columns:38px 1fr auto;column-gap:9px;align-items:center;text-align:left}.power-card.time-power:before{grid-row:1/4;grid-column:1;width:38px;height:38px;margin:0}.power-card.time-power b,.power-card.time-power span,.power-card.time-power small{grid-column:2}.power-card.time-power span{min-height:0;margin:1px 0}.power-card.time-power small{grid-column:3;grid-row:1/4}
    .intro-start{width:100%;min-height:52px;margin-top:15px;border:0;border-radius:15px;color:white;background:var(--navy);font-weight:1000;box-shadow:0 5px 0 #09141e}.intro-start:active{transform:translateY(3px);box-shadow:0 2px 0 #09141e}
    .level-overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:28px;background:rgba(23,40,56,.82);backdrop-filter:blur(10px)}.level-overlay.hidden{display:none}
    .result-card{position:relative;width:min(100%,350px);padding:25px 24px 24px;border:3px solid rgba(23,40,56,.12);border-radius:30px;background:var(--paper);text-align:center;box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.08) 0 8px 24px,rgba(0,0,0,.22) 0 18px 42px;overflow:hidden}.result-card.celebrate:before{content:"✦  ·  ✦  ·  ✦";position:absolute;inset:15px 0 auto;color:#ffd24f;font-size:15px;letter-spacing:.5em;animation:sparkle 1.2s ease-in-out infinite}
    .result-badge{position:relative;width:68px;height:68px;margin:8px auto 14px;display:grid;place-items:center;border-radius:22px;background:#55d98a;font-size:34px;font-weight:1000;transform:rotate(-4deg);animation:awardBounce .65s cubic-bezier(.2,.9,.25,1.25)}.result-card h2{margin:5px 0 12px;font-size:34px;letter-spacing:-.055em}.result-score-wrap{margin:0 auto 9px}.result-score-label{display:block;color:#71818b;font-size:9px;font-weight:1000;letter-spacing:.14em;text-transform:uppercase}.result-score{display:block;font-size:48px;line-height:1;font-weight:1000;font-variant-numeric:tabular-nums;letter-spacing:-.07em}.result-stars{height:52px;display:flex;align-items:center;justify-content:center;gap:5px}.award-star{display:inline-block;color:#dbe1df;font-size:38px;line-height:1;transform:scale(.25) translateY(18px);opacity:.25}.award-star.earned{color:#ffd24f;text-shadow:0 3px 0 #d39217;animation:starLand .55s cubic-bezier(.2,.9,.2,1.4) both}.result-card p{margin:3px 0 20px;color:#687982;font-size:13px}.result-actions{display:grid;gap:9px}.result-actions button{min-height:50px;border:0;border-radius:15px;font-weight:950}.result-primary{color:white;background:var(--navy)}.result-secondary{color:var(--ink);background:#e8eeeb}
    .toast{position:absolute;z-index:4;left:50%;top:22%;transform:translate(-50%,-20px);padding:10px 16px;border-radius:99px;color:white;background:var(--navy);font-size:12px;font-weight:950;opacity:0;pointer-events:none}.toast.show{animation:toast .9s ease both}
    @keyframes pulse{50%{transform:scale(1.1);box-shadow:0 7px 0 rgba(23,40,56,.18),0 0 0 8px rgba(255,255,255,.25)}}
    @keyframes hit{50%{transform:scale(1.08);filter:brightness(1.25)}to{opacity:.3;transform:scale(.7)}}
    @keyframes wrong{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
    @keyframes hold{to{transform:scale(.28);border-radius:50%;filter:brightness(1.2)}}
    @keyframes purpleFade{from{opacity:1}to{opacity:.03}}
    @keyframes toast{20%,75%{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-12px)}}
    @keyframes awardBounce{0%{opacity:0;transform:translateY(-24px) scale(.5) rotate(-12deg)}to{opacity:1;transform:translateY(0) scale(1) rotate(-4deg)}}
    @keyframes starLand{0%{opacity:0;transform:scale(.2) translateY(-28px) rotate(-20deg)}70%{opacity:1;transform:scale(1.18) translateY(0) rotate(6deg)}to{opacity:1;transform:scale(1) translateY(0) rotate(0)}}
    @keyframes sparkle{50%{opacity:.35;transform:scale(.94)}}
    @media(max-height:650px){.game-top{padding-top:8px}.mission{margin-bottom:6px}.board{gap:6px}.cell{border-radius:17px}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}.cell.purple.fading{animation:purpleFade var(--purple-duration,1s) linear forwards!important}}
  </style>
</head>
<body>
<main class="app">
  <section class="screen map-screen active" id="mapScreen">
    <header class="map-hero">
      <div class="hero-row"><span class="eyebrow">Level journey</span><span class="world-progress" id="worldProgress">0 / 70</span></div>
      <div class="map-logo">Mook<span>Worlds</span></div>
      <div class="map-title" id="mapTitle">Green Valley · Level 1 awaits</div>
    </header>
    <div class="map-wrap" id="mapWrap"></div>
  </section>

  <section class="screen game-screen" id="gameScreen">
    <div class="game-shell">
      <header class="game-top">
        <button class="map-back" id="mapBack" aria-label="Return to world map">‹</button>
        <div class="level-heading"><small id="stageLabel">Stage 1</small><strong id="levelLabel">Level 1</strong></div>
        <div class="score-box"><small>Score</small><b id="score">0</b></div>
        <button class="sound-toggle" id="soundToggle" type="button" aria-label="Mute soundtrack" aria-pressed="false">♫</button>
      </header>
      <div class="status-row">
        <div class="lives"><i class="life"></i><i class="life"></i><i class="life"></i><i class="life"></i></div>
        <div class="level-timer"><div class="level-timer-fill" id="timerFill"></div></div>
        <div class="time-left" id="timeLeft">30</div>
      </div>
      <div class="mission" id="mission">Tap the first green to start</div>
      <section class="board" id="board" aria-label="Mook game board"></section>
      <div class="toast" id="toast">Nice!</div>
      <section class="level-intro hidden" id="levelIntro">
        <div class="intro-card">
          <div class="intro-kicker">Level briefing</div><h2 id="introTitle">Green Valley · Level 1</h2><p class="intro-summary" id="introSummary">Survive 30 game seconds.</p>
          <div class="power-heading"><b>Equip your Gods</b><span>Unlimited testing</span></div>
          <div class="god-grid">
            <button class="power-card" data-power="sky" data-icon="☁" aria-pressed="false"><b>Sky God</b><span>Auto-clears every blue swipe</span><small>Unlimited</small></button>
            <button class="power-card" data-power="sun" data-icon="☀" aria-pressed="false"><b>Sun God</b><span>Auto-completes every yellow hold</span><small>Unlimited</small></button>
            <button class="power-card" data-power="rock" data-icon="◆" aria-pressed="false"><b>Rock God</b><span>Auto-breaks every gray rock</span><small>Unlimited</small></button>
          </div>
          <button class="power-card time-power" data-power="time" data-icon="◷" aria-pressed="false"><b>Time Slow</b><span>Slows game time by 25%</span><small>Unlimited</small></button>
          <button class="intro-start" id="introStart">Start level</button>
        </div>
      </section>
      <section class="level-overlay hidden" id="levelOverlay">
        <div class="result-card" id="resultCard">
          <div class="result-kicker" id="resultLevel">Green Valley · Level 1</div><div class="result-badge" id="resultBadge">★</div>
          <h2 id="resultTitle">Level clear!</h2>
          <div class="result-score-wrap"><span class="result-score-label">Points</span><b class="result-score" id="resultScore">0</b></div>
          <div class="result-stars" id="resultStars"><i class="award-star">★</i><i class="award-star">★</i><i class="award-star">★</i><i class="award-star">★</i></div>
          <p id="resultCopy">The next level is open.</p>
          <div class="result-actions">
            <button class="result-primary" id="resultPrimary">World map</button>
            <button class="result-secondary" id="resultSecondary">Retry level</button>
          </div>
        </div>
      </section>
    </div>
  </section>
</main>
<script>
  const STAGES = [
    { name:'Green Valley', icon:'●', className:'stage-green', mechanic:'green', description:'Tap & dodge' },
    { name:'Sky Current', icon:'↗', className:'stage-blue', mechanic:'blue', description:'Swipe the arrows' },
    { name:'Sunhold Sands', icon:'☀', className:'stage-yellow', mechanic:'yellow', description:'Press and hold' },
    { name:'Rock Summit', icon:'◆', className:'stage-rock', mechanic:'rock', description:'Break the rocks' },
    { name:'Violet Rush', icon:'✦', className:'stage-purple', mechanic:'purple', description:'One-second reactions' },
    { name:'Reverse Realm', icon:'⇄', className:'stage-opposite', mechanic:'opposite', description:'Everything means the opposite' },
    { name:'Quantum Flux', icon:'?', className:'stage-quantum', mechanic:'quantum', description:'Rules change mid-cell' }
  ];
  const LEVEL_DURATION_MS = 30000;
  const SWIPE_THRESHOLD = 32;
  const MAX_ACTIVE_TARGETS = 4;
  const MAX_ACTIVE_GREENS = 3;
  const GREEN_LIFETIME_MS = 2000;
  const RED_LIFETIME_MS = 2000;
  const BLUE_LIFETIME_MS = 2000;
  const YELLOW_LIFETIME_MS = 3000;
  const ROCK_LIFETIME_MS = 4000;
  const PURPLE_LIFETIME_MS = 1000;
  const DIRECTIONS = ['up','right','down','left'];
  const ARROWS = {up:'↑',right:'→',down:'↓',left:'←'};
  const OPPOSITE_DIRECTIONS = {up:'down',down:'up',left:'right',right:'left'};
  const board = document.querySelector('#board');
  const mapScreen = document.querySelector('#mapScreen');
  const gameScreen = document.querySelector('#gameScreen');
  const mapWrap = document.querySelector('#mapWrap');
  const mapTitle = document.querySelector('#mapTitle');

    clearTarget(type,index);loseLife();
  }
  function nextWorldTargetType() {
    if(config.mode==='opposite'||config.mode==='quantum'){
      const pool=config.mechanics.filter(type=>type!=='red');
      const type=pool[modePoolCursor%pool.length];modePoolCursor+=1;return type;
    }
    if(config.openingType==='green')return 'green';
    worldCellAccumulator+=config.worldCellShare;
    if(worldCellAccumulator+1e-9>=1){worldCellAccumulator-=1;return config.openingType;}
    const supportingTypes=config.mechanics.filter(type=>type!=='red'&&type!==config.openingType);
    const type=supportingTypes[modePoolCursor%supportingTypes.length]||'green';modePoolCursor+=1;return type;
  }
  function worldTargetMap(type){return{blue:blueCells,yellow:yellowCells,rock:rockCells,purple:purpleCells}[type];}
  function spawnActionTarget() {
    const accumulatorBefore=worldCellAccumulator;const cursorBefore=modePoolCursor;
    const type=nextWorldTargetType();
    if(type!=='green'&&worldTargetMap(type)?.size>=2){worldCellAccumulator=accumulatorBefore;modePoolCursor=cursorBefore;return -1;}
    const index=type==='green'?spawnGreen():({blue:spawnBlue,yellow:spawnYellow,rock:spawnRock,purple:spawnPurple}[type]?.()??-1);
    if(index<0){worldCellAccumulator=accumulatorBefore;modePoolCursor=cursorBefore;}
    return index;
  }
  function shouldSpawnRed(){
    if((config.mode==='opposite'||config.mode==='quantum')&&config.step<=2){redTrapAccumulator+=config.redChance;if(redTrapAccumulator+1e-9>=1){redTrapAccumulator-=1;return true;}return false;}
    return Math.random()<config.redChance;
  }
  function nextCycle() {
    if(!playing||!levelStarted)return;
    const targetCount=config.maxGreens===1?1:Math.random()<(.15+config.step*.055)?config.maxGreens:1;
    for(let i=0;i<targetCount;i++)spawnActionTarget();
    const trapAccumulatorBefore=redTrapAccumulator;
    if(shouldSpawnRed()&&spawnRed()<0&&(config.mode==='opposite'||config.mode==='quantum')&&config.step<=2)redTrapAccumulator=trapAccumulatorBefore;
    cycleTimer=setTimeout(nextCycle,scaledDelay(config.beatMs));
  }
  function resolveSuccess(type,index,assisted=false) {
    const map={green:activeGreens,blue:blueCells,yellow:yellowCells,rock:rockCells,purple:purpleCells}[type];const item=map.get(index);const wasTutorial=item?.tutorial;
    if(item?.expiry)clearTimeout(item.expiry);if(item?.holdTimer)clearTimeout(item.holdTimer);if(item?.switchTimer)clearTimeout(item.switchTimer);if(item?.assistTimer)clearTimeout(item.assistTimer);map.delete(index);resolving.add(index);
    cells[index].classList.add('hit');score+=1;scoreEl.textContent=String(score);showToast(wasTutorial?'GO!':'+1');cellFeedback(type,assisted);
    setTimeout(()=>{resolving.delete(index);clearCellVisual(index);},280);
    if(wasTutorial)startClock();
  }
  function clearCellVisual(index){cells[index].className='cell';cells[index].style.removeProperty('--purple-duration');delete cells[index].dataset.arrow;delete cells[index].dataset.hits;delete cells[index].dataset.prompt;}
  function tap(index) {
    if(!playing||resolving.has(index))return;
    if(rockCells.has(index)){hitRock(index);return;}
    if(blueCells.has(index)){wrong(index);if(!blueCells.get(index)?.tutorial){clearTarget('blue',index);}loseLife();return;}
    if(yellowCells.has(index)){beginHold(index);setTimeout(()=>endHold(index),0);return;}
    if(redCells.has(index)){if(redCells.get(index)?.tutorial){wrong(index);return;}clearTarget('red',index);wrong(index);loseLife();return;}
    if(purpleCells.has(index)){resolveSuccess('purple',index);return;}
    if(activeGreens.has(index)){resolveSuccess('green',index);return;}
    const graceUntil=graceCells.get(index)||0;
    if(graceUntil>=performance.now())return;
    graceCells.delete(index);
    if(levelStarted){wrong(index);loseLife();}
  }
  function hitRock(index,assisted=false){const rock=rockCells.get(index);if(!rock)return;rock.hidden=false;rock.hits-=1;cells[index].dataset.hits=String(rock.hits);showToast(rock.hits?`${rock.hits} left`:'Break!');if(rock.hits<=0)resolveSuccess('rock',index,assisted);else{playEffect('rock');if(!assisted)triggerHaptic(22);}}
  function beginHold(index){const yellow=yellowCells.get(index);if(!yellow||yellow.holding)return;yellow.holding=true;cells[index].classList.add('holding');yellow.holdTimer=setTimeout(()=>resolveSuccess('yellow',index),1000);}
  function endHold(index){const yellow=yellowCells.get(index);if(!yellow||!yellow.holding)return;clearTimeout(yellow.holdTimer);yellow.holding=false;yellow.holdTimer=0;cells[index].classList.remove('holding');}
  function resolveSwipe(index,dx,dy){const blue=blueCells.get(index);if(!blue){tap(index);return;}const far=Math.max(Math.abs(dx),Math.abs(dy))>=SWIPE_THRESHOLD;const direction=!far?'tap':Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');if(direction===blue.direction)resolveSuccess('blue',index);else{wrong(index);if(!blue.tutorial)clearTarget('blue',index);loseLife();}}
  function wireGesture(cell,index){let gesture=null;cell.addEventListener('pointerdown',event=>{event.preventDefault();if(yellowCells.has(index)){gesture={yellow:true};beginHold(index);}else gesture={x:event.clientX,y:event.clientY,blue:blueCells.has(index)};try{cell.setPointerCapture(event.pointerId)}catch(_){}});cell.addEventListener('pointerup',event=>{if(!gesture)return;const start=gesture;gesture=null;if(start.yellow){endHold(index);return;}const dx=event.clientX-start.x,dy=event.clientY-start.y;if(start.blue||blueCells.has(index))resolveSwipe(index,dx,dy);else tap(index);});cell.addEventListener('pointercancel',()=>{if(gesture?.yellow)endHold(index);gesture=null;});}
  function wrong(index){cells[index].classList.remove('wrong');void cells[index].offsetWidth;cells[index].classList.add('wrong');playEffect('green','wrong');triggerHaptic([45,30,60]);setTimeout(()=>cells[index].classList.remove('wrong'),310);}
  function loseLife(){if(!playing)return;misses+=1;lifeEls[misses-1]?.classList.add('lost');showToast('Life lost');if(misses>=4)finishLevel(false);}
  function showToast(text){toast.textContent=text;toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show');}
  function clearTargets(){['green','red','blue','yellow','rock','purple'].forEach(type=>{const map={green:activeGreens,red:redCells,blue:blueCells,yellow:yellowCells,rock:rockCells,purple:purpleCells}[type];[...map.keys()].forEach(index=>clearTarget(type,index));});resolving.clear();cells.forEach((_,index)=>clearCellVisual(index));}
  function clearResultAnimation(){cancelAnimationFrame(resultRaf);awardTimers.forEach(clearTimeout);awardTimers=[];}
  function clearRun(){playing=false;stopSoundtrack();introVisible=false;levelIntro.classList.add('hidden');clearTimeout(cycleTimer);cancelAnimationFrame(levelRaf);clearResultAnimation();clearTargets();graceCells.clear();}
  function animateResult(finalScore,earnedStars){
    clearResultAnimation();resultScore.textContent='0';awardStars.forEach(star=>star.classList.remove('earned'));
    const started=performance.now();const frame=now=>{const progress=Math.min(1,(now-started)/650);resultScore.textContent=String(Math.round(finalScore*(1-Math.pow(1-progress,3))));if(progress<1)resultRaf=requestAnimationFrame(frame);};resultRaf=requestAnimationFrame(frame);
    awardStars.slice(0,earnedStars).forEach((star,index)=>awardTimers.push(setTimeout(()=>star.classList.add('earned'),150+index*130)));
  }
  function finishLevel(success,immediateMap=false){
    if(!playing)return;const finishedLevel=currentLevel;const finalScore=score;const runStars=success?starsForMisses(misses):0;clearRun();
    resultLevel.textContent=`${STAGES[stageFor(finishedLevel)].name} · Level ${localLevel(finishedLevel)}`;resultScore.textContent=String(finalScore);
    if(success){
      completed[finishedLevel]=Math.max(Number(completed[finishedLevel])||0,finalScore);starScores[finishedLevel]=Math.max(Number(starScores[finishedLevel])||0,runStars);unlockedThrough=Math.max(unlockedThrough,Math.min(70,finishedLevel+1));persistProgress();
      resultCard.classList.add('celebrate');resultBadge.textContent='★';resultTitle.textContent=`Level ${localLevel(finishedLevel)} clear!`;resultCopy.textContent=`Best: ${starScores[finishedLevel]} stars. ${finishedLevel===70?'Every Mook world is complete.':`Level ${localLevel(finishedLevel+1)} is now open.`}`;resultPrimary.textContent='World map';resultSecondary.textContent='Play again';
    }else{
      resultCard.classList.remove('celebrate');resultBadge.textContent='×';resultTitle.textContent='Try again';resultCopy.textContent='Four misses. Learn the rhythm and take another run.';resultPrimary.textContent='Retry level';resultSecondary.textContent='World map';
    }
    renderMap();if(immediateMap){returnToMap();return;}levelOverlay.classList.remove('hidden');animateResult(finalScore,runStars);resultPrimary.onclick=()=>success?returnToMap():selectLevel(finishedLevel);resultSecondary.onclick=()=>success?selectLevel(finishedLevel):returnToMap();
  }
  function returnToMap(){clearRun();levelOverlay.classList.add('hidden');renderMap();showScreen('map');const current=document.querySelector('.level-node.current');current?.scrollIntoView({block:'center',behavior:'smooth'});}
  function finishLevelForTest(success,immediateMap=true){finishLevel(success,immediateMap);}
  function unlockThroughForTest(level){unlockedThrough=Math.max(1,Math.min(70,level));renderMap();}
  function spawnForTest(type){return({green:spawnGreen,red:spawnRed,blue:spawnBlue,yellow:spawnYellow,rock:spawnRock,purple:spawnPurple}[type]||(()=>-1))();}
  function clearTargetsForTest(){clearTargets();graceCells.clear();}
  function worldMixSequenceForTest(count){const saved=worldCellAccumulator,savedCursor=modePoolCursor;worldCellAccumulator=0;modePoolCursor=0;const sequence=Array.from({length:count},()=>nextWorldTargetType());worldCellAccumulator=saved;modePoolCursor=savedCursor;return sequence;}
  function redTrapSequenceForTest(count){const saved=redTrapAccumulator;redTrapAccumulator=.5;const sequence=Array.from({length:count},()=>shouldSpawnRed());redTrapAccumulator=saved;return sequence;}
  function getState(){return{screen,level:currentLevel,playing,levelStarted,onboarding,onboardingType,introVisible,equippedPowers:[...equippedPowers],timeScale:runTimeScale,music:{running:musicRunning,muted:musicMuted,bpm:soundtrackBpm(),feedbackCount,hapticCount},starScores:{...starScores},score,misses,active:[...activeGreens.keys()],red:[...redCells.keys()],blue:[...blueCells.entries()].map(([index,item])=>({index,direction:item.direction,shownDirection:item.shownDirection,tutorial:item.tutorial})),yellow:[...yellowCells.keys()],rock:[...rockCells.entries()].map(([index,item])=>({index,hits:item.hits,hidden:Boolean(item.hidden),tutorial:item.tutorial})),purple:[...purpleCells.keys()],unlockedThrough};}

  powerCards.forEach(card=>card.addEventListener('click',()=>togglePower(card.dataset.power)));
  introStart.addEventListener('click',beginSelectedLevel);
  soundToggle.addEventListener('click',toggleSound);
  ['selectstart','dragstart','contextmenu'].forEach(type=>gameScreen.addEventListener(type,event=>event.preventDefault()));
  document.addEventListener('selectionchange',()=>{if(screen==='game'){const selection=getSelection();if(selection&&!selection.isCollapsed)selection.removeAllRanges();}});
  mapBack.addEventListener('click',returnToMap);
  updateSoundButton();renderMap();
  window.__mookLevels={getLevelConfig,getState,selectLevel,tap,resolveSwipe,beginHold,endHold,hitRock,finishLevelForTest,unlockThroughForTest,returnToMap,spawnForTest,expireForTest:expireTarget,clearTargetsForTest,worldMixSequenceForTest,redTrapSequenceForTest,starsForMisses,scaledDelayForTest:scaledDelay,soundtrackBpmForTest:soundtrackBpm,pauseForTest:()=>clearTimeout(cycleTimer)};
</script>
